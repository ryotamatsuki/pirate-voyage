`#version 300 es
precision highp float;in vec2 q;out vec4 O;uniform vec3 uForward,uRight,uUp,uSun,uFog;uniform float uAspect,uTan,uTime;float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);}float fbm(vec2 p){return noise(p)*.52+noise(p*2.1)*.26+noise(p*4.1)*.13+noise(p*8.3)*.06;}void main(){vec3 ray=normalize(uForward+uRight*q.x*uAspect*uTan+uUp*q.y*uTan);float h=max(ray.y,0.);vec3 top=vec3(.28,.52,.62);vec3 sky=mix(uFog,top,pow(h,.44));float sun=max(dot(ray,uSun),0.);vec3 gold=vec3(1.,.71,.36);sky+=gold*pow(sun,14.)*.18+gold*pow(sun,350.)*.47+vec3(1.,.86,.57)*smoothstep(.99978,.99992,sun)*1.15;if(ray.y>.015){vec2 p=ray.xz/(ray.y+.17)*1.7+vec2(uTime*.004,uTime*.002);float c=smoothstep(.52,.78,fbm(p))*smoothstep(.012,.20,h);vec3 cloud=vec3(.83,.83,.73)+vec3(.18,.12,.055)*pow(sun,9.);sky=mix(sky,cloud,c*.8);}O=vec4(sky,1);}`);
