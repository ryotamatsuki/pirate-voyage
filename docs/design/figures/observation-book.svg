<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img"><title>航海帳に知ったことと次の行動をまとめる配置案</title><desc>本作向けに新規制作した配置検討用の概念図。2026年10月1日の提案で、未実装。</desc><g font-family="Droid Sans Fallback, sans-serif"><rect x="0" y="0" width="1400" height="1000" rx="0" fill="#F3EBDC" stroke="none" stroke-width="1"/><text x="40" y="55" font-size="32" fill="#20343A" font-weight="bold">得た知識と、次の行動を読む</text><text x="40" y="88" font-size="16" fill="#53676B" font-weight="normal">航海帳と報告の概念図 / 2026-10-01 提案・未実装 / 本作の既存情報を整理</text><text x="40" y="131" font-size="20" fill="#20343A" font-weight="bold">PC：記録を先に読み、保存操作は別の区画へ</text><text x="976" y="131" font-size="20" fill="#20343A" font-weight="bold">縦画面：見出しの下へ本文を置く</text><rect x="40" y="155" width="894" height="563" rx="10" fill="#F3EBDC" stroke="#112C38" stroke-width="2"/><rect x="40" y="155" width="894" height="76" rx="10" fill="#112C38" stroke="none" stroke-width="1"/><rect x="40" y="217" width="894" height="14" rx="0" fill="#112C38" stroke="none" stroke-width="1"/><text x="65" y="201" font-size="26" fill="#F3EBDC" font-weight="bold">航海帳</text><text x="274" y="201" font-size="20" fill="#F3EBDC" font-weight="normal">潮見の浮標</text><rect x="803" y="171" width="109" height="44" rx="6" fill="#1E5360" stroke="none" stroke-width="1"/><text x="815" y="200" font-size="16" fill="#F3EBDC" font-weight="bold">閉じる</text><text x="66" y="266" font-size="16" fill="#336759" font-weight="bold">観測済み / 未報告</text><text x="397" y="266" font-size="15" fill="#53676B" font-weight="normal">観測日：ゲーム内の記録を表示</text><line x1="66" y1="285" x2="908" y2="285" stroke="#B8B5AA" stroke-width="1"/><text x="66" y="324" font-size="20" fill="#20343A" font-weight="bold">分かったこと</text><text x="66" y="357" font-size="18" fill="#20343A" font-weight="normal">浮標の北側に、潮の境目がある。</text><g transform="translate(806 357) scale(0.58)"><path d="M-23 12 L23 12 L15 23 L-15 23 Z" fill="#F3EBDC" stroke="#20343A" stroke-width="2"/><path d="M-13 12 L-8 -21 L8 -21 L13 12 Z" fill="#9D3F3B" stroke="#F3EBDC" stroke-width="2"/><rect x="-10" y="-9" width="20" height="9" rx="0" fill="#F3EBDC" stroke="none" stroke-width="1"/><line x1="0" y1="-22" x2="0" y2="-65" stroke="#F3EBDC" stroke-width="2"/><path d="M2 -65 L33 -55 L2 -43 Z" fill="#E8C98D" stroke="none" stroke-width="1"/><path d="M-40 33 Q0 45 39 32" fill="none" stroke="#B7D7D7" stroke-width="2"/></g><path d="M684 315 Q724 301 767 315 T863 315" fill="none" stroke="#53676B" stroke-width="2"/><text x="694" y="405" font-size="14" fill="#53676B" font-weight="normal">潮と旗の図を本文の近くに</text><text x="66" y="424" font-size="20" fill="#53676B" font-weight="bold">未確認</text><text x="66" y="457" font-size="18" fill="#20343A" font-weight="normal">「北の灯」の所在と、潮のつながり。</text><text x="66" y="484" font-size="15" fill="#53676B" font-weight="normal">今の試作では訪問できない手掛かりです。</text><text x="66" y="535" font-size="20" fill="#20343A" font-weight="bold">次の行動</text><text x="66" y="568" font-size="18" fill="#20343A" font-weight="normal">松帆港の海図係へ、観測を報告する。</text><text x="66" y="596" font-size="15" fill="#53676B" font-weight="normal">報告できる場所と、現在の受理状況をここで確かめる。</text><line x1="66" y1="619" x2="908" y2="619" stroke="#B8B5AA" stroke-width="1"/><text x="66" y="653" font-size="17" fill="#20343A" font-weight="bold">日誌</text><text x="269" y="653" font-size="17" fill="#20343A" font-weight="bold">保存・JSON・復帰</text><text x="66" y="684" font-size="15" fill="#53676B" font-weight="normal">記録と保存の操作を同じ本文に混ぜず、見出しで分ける。</text><rect x="40" y="741" width="894" height="198" rx="10" fill="#E8E1D2" stroke="none" stroke-width="1"/><text x="66" y="779" font-size="22" fill="#20343A" font-weight="bold">海図係 / 報告を受理した後</text><rect x="66" y="798" width="164" height="39" rx="6" fill="#336759" stroke="none" stroke-width="1"/><text x="81" y="824" font-size="16" fill="#F3EBDC" font-weight="bold">報告：受理済み</text><text x="253" y="824" font-size="16" fill="#20343A" font-weight="normal">観測 完了 / 受理 完了</text><text x="66" y="863" font-size="16" fill="#20343A" font-weight="normal">登録航路は準備中。今使える操作を、完了の説明より先に見つける。</text><rect x="66" y="882" width="112" height="44" rx="6" fill="#1E5360" stroke="none" stroke-width="1"/><text x="78" y="911" font-size="16" fill="#F3EBDC" font-weight="bold">市場</text><rect x="190" y="882" width="112" height="44" rx="6" fill="#1E5360" stroke="none" stroke-width="1"/><text x="202" y="911" font-size="16" fill="#F3EBDC" font-weight="bold">補給</text><rect x="314" y="882" width="150" height="44" rx="6" fill="#1E5360" stroke="none" stroke-width="1"/><text x="326" y="911" font-size="16" fill="#F3EBDC" font-weight="bold">出港の準備</text><text x="508" y="913" font-size="14" fill="#53676B" font-weight="normal">受理日：ゲーム内の記録を表示</text><rect x="976" y="155" width="383" height="710" rx="10" fill="#F3EBDC" stroke="#112C38" stroke-width="2"/><rect x="976" y="155" width="383" height="76" rx="10" fill="#112C38" stroke="none" stroke-width="1"/><rect x="976" y="217" width="383" height="14" rx="0" fill="#112C38" stroke="none" stroke-width="1"/><text x="995" y="201" font-size="24" fill="#F3EBDC" font-weight="bold">航海帳</text><rect x="1241" y="171" width="98" height="44" rx="6" fill="#1E5360" stroke="none" stroke-width="1"/><text x="1253" y="200" font-size="16" fill="#F3EBDC" font-weight="bold">閉じる</text><text x="997" y="268" font-size="21" fill="#20343A" font-weight="bold">潮見の浮標</text><text x="997" y="299" font-size="16" fill="#336759" font-weight="normal">観測済み / 未報告</text><line x1="997" y1="318" x2="1337" y2="318" stroke="#B8B5AA" stroke-width="1"/><text x="997" y="353" font-size="19" fill="#20343A" font-weight="bold">分かったこと</text><text x="997" y="385" font-size="17" fill="#20343A" font-weight="normal">浮標の北側に、</text><text x="997" y="411" font-size="17" fill="#20343A" font-weight="normal">潮の境目がある。</text><text x="997" y="467" font-size="19" fill="#53676B" font-weight="bold">未確認</text><text x="997" y="499" font-size="17" fill="#20343A" font-weight="normal">「北の灯」の所在と、</text><text x="997" y="525" font-size="17" fill="#20343A" font-weight="normal">潮のつながり。</text><text x="997" y="554" font-size="15" fill="#53676B" font-weight="normal">現在は訪問できない手掛かりです。</text><text x="997" y="611" font-size="19" fill="#20343A" font-weight="bold">次の行動</text><text x="997" y="643" font-size="17" fill="#20343A" font-weight="normal">松帆港の海図係へ</text><text x="997" y="669" font-size="17" fill="#20343A" font-weight="normal">観測を報告する。</text><line x1="997" y1="698" x2="1337" y2="698" stroke="#B8B5AA" stroke-width="1"/><text x="997" y="732" font-size="16" fill="#53676B" font-weight="normal">観測日 / 受理状況</text><text x="997" y="780" font-size="16" fill="#20343A" font-weight="normal">この下に日誌と保存の区画</text><text x="997" y="819" font-size="15" fill="#53676B" font-weight="normal">本文だけをスクロールする</text><text x="976" y="904" font-size="16" fill="#20343A" font-weight="normal">確定と未確認を色だけで区別せず、</text><text x="976" y="934" font-size="16" fill="#20343A" font-weight="normal">日本語の見出しでも示す。</text><text x="40" y="979" font-size="15" fill="#53676B" font-weight="normal">図は配置案です。報告先、受理条件、記録、保存形式は変更せず、現在の状態から表示します。</text></g></svg>
